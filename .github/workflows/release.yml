# =============================================================================
# GoVector Release Pipeline — Multi-platform builds + Docker + C API
# =============================================================================
#
# Triggers:
#   - Push of v* tags (stable releases)
#   - Manual dispatch
#
# Jobs:
#   1. build       — Cross-compile binaries (linux/darwin/windows × amd64/arm64)
#   2. build-capi  — Python C API bindings (SWIG)
#   3. docker      — Multi-arch Docker image → Docker Hub
#   4. homebrew    — Generate & push formula → homebrew-govector tap
#
# Secrets required:
#   - DOCKERHUB_USERNAME  — Docker Hub username
#   - DOCKERHUB_TOKEN    — Docker Hub access token
#   - HOMEBREW_TAP_TOKEN — PAT with write access to DotNetAge/homebrew-govector
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          OUTPUT_NAME="govector_v${VERSION}_${GOOS}_${GOARCH}${matrix.ext}"
          
          go build -ldflags="-s -w" -o "${OUTPUT_NAME}" ./cmd/govector
          
          echo "Built: ${OUTPUT_NAME}"
          ls -la "${OUTPUT_NAME}"

      - name: Create tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "govector_v${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "govector_v${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.exe"
          else
            tar -czf "govector_v${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "govector_v${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          release_name: govector ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            govector_v*.tar.gz
            govector_v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-capi:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: true

      - name: Build Go static library
        run: |
          cd capi
          go build -buildmode=c-archive -o libgovector_c.a ./main_func.go

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig

      - name: Generate SWIG wrapper
        working-directory: capi
        run: |
          swig -python -o govector_wrap.cxx govector.i

      - name: Build Python extension
        working-directory: capi
        run: |
          g++ -fPIC -shared \
            govector_wrap.cxx \
            -o _govector.so \
            $(python3 -m py_compile --print path)/../include/python3.12 \
            -L. -lgovector_c \
            $(python3-config --ldflags --embed) \
            -lpthread

      - name: Upload Python binding
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          release_name: govector ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            capi/_govector.so
            capi/govector.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Docker — Multi-arch image build & push to Docker Hub
  # ==========================================================================
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/govector:${VERSION},${{ secrets.DOCKERHUB_USERNAME }}/govector:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/DotNetAge/govector
            org.opencontainers.image.description=GoVector - High-performance embedded vector database
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

  # ==========================================================================
  # Homebrew — Generate formula & push to homebrew-govector tap
  # ==========================================================================
  homebrew:
    name: Homebrew Formula
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Generate and push Homebrew formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          chmod +x scripts/homebrew-release.sh
          bash scripts/homebrew-release.sh "${VERSION}"
