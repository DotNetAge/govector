syntax = "proto3";

package core;

option go_package = "github.com/DotNetAge/govector/core/proto";

message PointStruct {
  string id = 1;
  repeated float vector = 2;
  map<string, Value> payload = 3;
}

message Value {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
  }
}

message ScoredPoint {
  string id = 1;
  uint64 version = 2;
  float score = 3;
  map<string, Value> payload = 4;
}

message Condition {
  string key = 1;
  MatchValue match = 2;
}

message MatchValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
  }
}

message Filter {
  repeated Condition must = 1;
  repeated Condition must_not = 2;
}
